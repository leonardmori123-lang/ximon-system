<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Requisition Form | Ximon</title>
  <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <header id="topbar"></header>

  <main class="container py-4 page-mid">
    <p class="mb-3"><a href="/requisitions.html">Back to my requisitions</a></p>
    <h1 class="h5" id="title">Requisition Form</h1>
    <p class="hint">The RF number and the filing date are added by the system.</p>

    <form id="rf-form" class="panel p-4" novalidate>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label" for="project">Project</label>
          <select id="project" class="form-select" required></select>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="date-needed">Date needed</label>
          <input id="date-needed" class="form-control" type="date" required>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="urgency">Urgency</label>
          <select id="urgency" class="form-select" required>
            <option value="low">Low</option>
            <option value="normal" selected>Normal</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="purpose">Purpose</label>
        <textarea id="purpose" class="form-control" rows="2" maxlength="300" placeholder="What the items are for" required></textarea>
      </div>

      <h2 class="h6">Items</h2>
      <div id="lines" class="mb-2"></div>
      <button id="add-line" class="btn btn-outline-secondary btn-sm mb-4" type="button">Add another item</button>

      <p id="error" class="status-bad" role="alert" hidden></p>
      <div class="d-flex gap-2">
        <button id="submit" class="btn btn-ximon" type="submit">Submit requisition</button>
        <a class="btn btn-outline-secondary" href="/requisitions.html">Cancel</a>
      </div>
    </form>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/rf-form.js"></script>
</body>
</html>
