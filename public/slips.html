<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issuance slips | Ximon</title>
  <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <header id="topbar"></header>

  <main class="container py-4 page-wide">
    <p id="error" class="status-bad" role="alert" hidden></p>

    <section id="ready" hidden class="mb-5">
      <h2 class="h5">Ready to release</h2>
      <p class="hint">Approved requisitions with reserved items and no open slip. Prepare a slip, then release the items.</p>
      <div class="panel table-responsive">
        <table class="table mb-0 align-middle">
          <thead><tr><th>RF number</th><th>Project</th><th>Requested by</th><th>Needed by</th><th>Urgency</th><th class="num">Items</th><th></th></tr></thead>
          <tbody id="ready-rows"></tbody>
        </table>
      </div>
      <p id="ready-empty" class="hint mt-3" hidden>Nothing is waiting for a slip.</p>
    </section>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h5 mb-0" id="title">Issuance slips</h1>
      <select id="status" class="form-select" aria-label="Filter by status" style="width: 13rem;"></select>
    </div>
    <p id="note" class="hint" hidden></p>
    <div class="panel table-responsive">
      <table class="table mb-0 align-middle">
        <thead><tr><th>Slip</th><th>RF number</th><th>Project</th><th>Requested by</th><th>Status</th><th>Prepared</th><th class="num">Items</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="hint mt-3" hidden>No slips here.</p>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/slips.js"></script>
</body>
</html>
